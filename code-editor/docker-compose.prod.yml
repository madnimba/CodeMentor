version: '3.8'

services:
  code-editor:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-username/your-repo}/code-editor:latest
    ports:
      - "3000:3000"  # HTTP API
      - "8081:8081"  # WebSocket
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WS_PORT=8081
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://your-frontend-domain.com}
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=10
      - MAX_CONCURRENT_EXECUTIONS=5
      - MAX_QUEUE_SIZE=10
      - CODE_SIZE_LIMIT=50000
      - EXECUTION_TIMEOUT=15000
      - CPU_TIME_LIMIT=5
      - MEMORY_LIMIT=512000
      - ENABLE_LOGGING=true
      - LOG_LEVEL=info
      - JUDGE0_API=${JUDGE0_API}
      - RAPIDAPI_HOST=${RAPIDAPI_HOST}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - code-mentor-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  code-mentor-network:
    driver: bridge 