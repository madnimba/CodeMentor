version: '3.8'

services:
  code-editor:
    build: .
    ports:
      - "3000:3000"  # HTTP API
      - "8081:8081"  # WebSocket
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WS_PORT=8081
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=10
      - MAX_CONCURRENT_EXECUTIONS=5
      - MAX_QUEUE_SIZE=10
      - CODE_SIZE_LIMIT=50000
      - EXECUTION_TIMEOUT=15000
      - CPU_TIME_LIMIT=5
      - MEMORY_LIMIT=512000
      - ENABLE_LOGGING=true
      - LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - code-mentor-network

networks:
  code-mentor-network:
    driver: bridge 