name: Deploy Code Editor Service

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'code-editor/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'code-editor/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/code-editor

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: code-editor/package-lock.json
        
    - name: Install dependencies
      working-directory: ./code-editor
      run: npm ci
      
    - name: Run tests
      working-directory: ./code-editor
      run: |
        # Add your test commands here
        echo "Running tests..."
        # npm test
        
    - name: Lint code
      working-directory: ./code-editor
      run: |
        # Add your lint commands here
        echo "Running linting..."
        # npm run lint

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./code-editor
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to production
      run: |
        echo "Deploying code-editor service..."
