name: CI/CD Image-Based Deployment

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run backend tests
        working-directory: Backend
        run: mvn test

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm install

      - name: Run frontend tests
        working-directory: Frontend
        run: npm test

  build-and-deploy:
    name: Build & Deploy Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend ./Backend
          docker push ${{ secrets.DOCKER_USERNAME }}/backend

      - name: Build & push frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend ./Frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend

      - name: Build & push code-editor image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/code-editor ./code-editor
          docker push ${{ secrets.DOCKER_USERNAME }}/code-editor

      - name: SSH & deploy on Azure VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          env:
            JUDGE0_API: ${{ secrets.JUDGE0_API }}
            RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
            RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          script: |
            cd ~/codementor
            docker pull ${{ secrets.DOCKER_USERNAME }}/backend
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend
            docker pull ${{ secrets.DOCKER_USERNAME }}/code-editor
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d
