version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: codementor-backend
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SERVER_PORT: ${SERVER_PORT}
      SERVER_CONTEXT_PATH: ${SERVER_CONTEXT_PATH}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      SPRING_PROFILES_ACTIVE: docker
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: false

      SPRING_WEB_CORS_ALLOWED_ORIGINS: http://localhost,http://nginx
      SPRING_WEB_CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS
      SPRING_WEB_CORS_ALLOWED_HEADERS: "*"
    expose:
      - "8080"
    networks:
      - codementor-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: codementor-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - codementor-network
    restart: unless-stopped

  # nginx:
  #   image: nginx:alpine
  #   container_name: codementor-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./Frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - codementor-network
  #   restart: unless-stopped

networks:
  codementor-network:
    driver: bridge
